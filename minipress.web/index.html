<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Minipress</title>
        <link rel="stylesheet" href="css/style.css" />
        <script src="dist/index.js" defer></script>
    </head>
    <body>
        <!-- Content -->
        <h1>MiniPress</h1>

        <div class="container">
            <section id="current_article"></section>

            <nav id="categories-sidebar">
                <h2>Catégories</h2>
                <div id="categories-list"><p>Chargement...</p></div>
            </nav>

            <h2>Articles</h2>
                <div id="sort-controls" style="margin-bottom: 15px;">
                    <button id="btn-sort-desc" style="font-weight: bold;"> Nouveau </button>
                    <button id="btn-sort-asc"> Ancien </button>
                </div>
            <section id="articles"><p>Chargement...</p></section>
        </div>

        <!-- Templates -->
        <script id="tpl-articles" type="text/x-handlebars-template">
            {{#each articles}}
                <article class="article-item">
                    <h2 data-href="{{links.self.href}}">{{article.titre}}</h2>
                    <p>Date : {{article.date_creation}}</p>
                    <p>Auteur : {{article.auteur_id}}</p>
                </article>
            {{/each}}
        </script>

        <script id="tpl-categories" type="text/x-handlebars-template">
            <ul>
                {{#each categories}}
                    <li class="categorie-item" data-id="{{id}}">
                        {{nom}}
                    </li>
                {{/each}}
            </ul>
        </script>

        <script id="tpl-full-article" type="text/x-handlebars-template">
            <article class="full-article">
                <h2>{{titre}}</h2>
                <p><strong>Publié le :</strong> {{date_publication}}</p>

                <div class="contenu">
                    {{{contenu_html}}}
                </div>

                {{#if resume_html}}
                <div class="resume">
                    <h3>Résumé</h3>
                    {{{resume_html}}}
                </div>
                {{/if}}
            </article>
        </script>
    </body>
</html>
