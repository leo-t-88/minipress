<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Minipress</title>
        <link rel="stylesheet" href="css/style.css" />
        <script src="dist/index.js" defer></script>
    </head>
    <body>
        <h1>MiniPress</h1>

        <div class="container">
            <section id="current_article"></section>

            <nav id="categories-sidebar">
                <h2>Catégories</h2>
                <div id="categories-list"><p>Chargement...</p></div>
            </nav>

            <h2>Articles</h2>
            <input
                type="text"
                id="search-input"
                placeholder="Rechercher un article"
            />
            <div id="sort-controls" style="margin-bottom: 15px">
                <button id="btn-sort-desc" style="font-weight: bold">
                    Nouveau
                </button>
                <button id="btn-sort-asc">Ancien</button>
            </div>
            <section id="articles"><p>Chargement...</p></section>
        </div>
    </body>
</html>
