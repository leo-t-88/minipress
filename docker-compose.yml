networks:
  minipress.net:
    driver: bridge

services:
  frontend:
    image: caddy:2.11.4-alpine
    volumes:
      - ./minipress.web/:/usr/share/caddy/
    ports:
      - "81:80"
    networks:
      - minipress.net
    depends_on:
      - app

  app:
    image: leot88/php:8.5.6
    ports:
      - "80:80"
    volumes :
      - ./minipress.core/:/var/php/
    working_dir: /var/php/src
    networks:
      - minipress.net
    depends_on:
      - sql
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  sql:
    image: mariadb:12.3.2
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mysql
    networks:
      minipress.net:
        aliases:
          - sql.db

  adminer:
    image: adminer:5.4.2
    ports:
      - "8080:8080"
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    networks:
      - minipress.net
